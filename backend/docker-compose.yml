# Full stack: PostgreSQL 16 + API + worker + web frontend. Values come from backend/.env (never committed).
# Usage (PowerShell, from the backend folder):  docker compose --env-file .env up --build
# Then open http://localhost:3000 (web) and http://localhost:8000/docs (API).
#
# Other PCs on the network: in backend/.env set PUBLIC_API_URL=http://<server-ip>:8000/api/v1 and
# CORS_ORIGINS=http://<server-ip>:3000, then run the same command again (the web image is rebuilt).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      POSTGRES_DB: ${DB_NAME:-pims_db}
    volumes:
      - pims_pgdata:/var/lib/postgresql/data
    # Published on 5433 so it does not clash with a PostgreSQL already running on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pims_db}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-pims_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - pims_storage:/app/storage

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-pims_db}
    command: ["python", "-m", "app.workers.run"]
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../frontend
      args:
        # The address the users' browsers call; baked into the web image at build time.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_API_MODE: live
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pims_pgdata:
  pims_storage:
